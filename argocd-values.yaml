configs:
  params:
    server.insecure: "true"
redis-ha:
  enabled: false
controller:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
server:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
repoServer:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  replicas: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
