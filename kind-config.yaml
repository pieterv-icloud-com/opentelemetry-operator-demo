kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: opentelemetry-operator-demo
networking:
  # Publish on all host interfaces so the dev container can reach the API server.
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
kubeadmConfigPatches:
  # The dev container reaches the host (and the published API port) via host.containers.internal.
  - |
    kind: ClusterConfiguration
    apiServer:
      certSANs:
        - host.containers.internal
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker