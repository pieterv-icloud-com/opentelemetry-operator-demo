# Kind pod processes use descendant PID namespaces; recursive translation is required
# (see https://github.com/open-telemetry/opentelemetry-ebpf-profiler/pull/1801).
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: ebpf-profiler
  namespace: observability
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-ebpf-profiler:0.165.0
  serviceAccount: opentelemetry-collector
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  args:
    feature-gates: +service.profilesSupport
  hostPID: true
  securityContext:
    capabilities:
      add: ["SYS_ADMIN", "BPF", "PERFMON"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  volumes:
    - name: proc
      hostPath:
        path: /proc
    - name: sys-kernel
      hostPath:
        path: /sys/kernel
    - name: sys-kernel-debug
      hostPath:
        path: /sys/kernel/debug
    - name: sys-fs-cgroup
      hostPath:
        path: /sys/fs/cgroup
    - name: lib-modules
      hostPath:
        path: /lib/modules
  volumeMounts:
    - name: proc
      mountPath: /proc
      readOnly: true
    - name: sys-kernel
      mountPath: /sys/kernel
      readOnly: true
    - name: sys-kernel-debug
      mountPath: /sys/kernel/debug
      readOnly: true
    - name: sys-fs-cgroup
      mountPath: /sys/fs/cgroup
      readOnly: true
    - name: lib-modules
      mountPath: /lib/modules
      readOnly: true
  config:
    receivers:
      profiling:
        samples_per_second: 97
        pid_namespace_translation_mode: recursive
        # Processes younger than this are skipped: samples taken while a process
        # is still starting (or has already exited) lack reliable /proc metadata,
        # which Pyroscope's OTLP ingestion rejects as malformed (empty label
        # name), poisoning the whole export batch. Dropping them at the source
        # keeps bad samples from ever being sent.
        filter_min_process_age: 5s
    exporters:
      otlp_grpc/pyroscope:
        endpoint: pyroscope.observability.svc.cluster.local:4040
        tls:
          insecure: true
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
            - container.image.name
            - container.image.tag
            - service.name
            - service.namespace
            - service.instance.id
          otel_annotations: true
        filter:
          node_from_env_var: K8S_NODE_NAME
        pod_association:
          - sources:
              - from: resource_attribute
                name: container.id
    service:
      pipelines:
        profiles:
          exporters: [otlp_grpc/pyroscope]
          processors: [memory_limiter, k8s_attributes]
          receivers: [profiling]
