apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-demo
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: opentelemetry-operator-demo
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    targetRevision: 0.42.0
    chart: opentelemetry-demo
    helm:
      releaseName: opentelemetry-demo
      values: |
        default:
          envOverrides:
            - name: OTEL_COLLECTOR_NAME
              value: opentelemetry-collector.observability.svc.cluster.local
        jaeger:
          enabled: false              
        opentelemetry-collector:
          enabled: false
        components:
          frontend-proxy:
            ingress:
              enabled: true
              ingressClassName: nginx
              hosts:
                - host: otel-demo.local
                  paths:
                    - path: /
                      pathType: Prefix
                      port: 8080
          frontend:
            envOverrides:
              - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                value: http://otel-demo.local/otlp-http/v1/traces
          kafka:
            envOverrides:
              - name: KAFKA_ADVERTISED_LISTENERS
                value: PLAINTEXT://kafka.otel-demo.svc.cluster.local:9092
          opamp-server:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - PruneLast=true
    retry:
      limit: -1