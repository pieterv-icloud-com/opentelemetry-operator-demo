apiVersion: v1
kind: Secret
metadata:
  labels:
    argocd.argoproj.io/secret-type: repository
  name: opentelemetry-operator-demo
  namespace: argocd
stringData:
  type: git
  url: https://github.com/pieterv-icloud-com/opentelemetry-operator-demo.git
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: opentelemetry-operator-demo-overlays
  namespace: argocd
spec:
  project: opentelemetry-operator-demo
  source:
    repoURL: https://github.com/pieterv-icloud-com/opentelemetry-operator-demo.git
    targetRevision: #CLUSTER_BRANCH#
    path: environments/overlays/#CLUSTER_ENVIRONMENT#
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: -1
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: opentelemetry-operator-demo-annotations
  namespace: argocd
spec:
  project: opentelemetry-operator-demo
  source:
    repoURL: https://github.com/pieterv-icloud-com/opentelemetry-operator-demo.git
    targetRevision: #CLUSTER_BRANCH#
    path: environments/annotations/#CLUSTER_ENVIRONMENT#
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: -1